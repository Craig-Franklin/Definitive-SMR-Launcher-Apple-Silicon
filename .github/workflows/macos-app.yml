name: Mac app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Craig-Franklin/Definitive-SMR-Launcher-Apple-Silicon'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install arm64 build dependencies
        run: brew install python@3.12 python-tk@3.12
      - name: Run synthetic tests
        run: /opt/homebrew/bin/python3.12 -m unittest discover -s tests -v
      - name: Build development app
        run: ./scripts/build_macos.sh
      - name: Build development disk image
        run: ./scripts/build_dmg.sh "dist/Definitive SMR Launcher Apple Silicon.app" "dist/Definitive-SMR-development.dmg"
      - name: Verify development app
        run: |
          app="dist/Definitive SMR Launcher Apple Silicon.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Definitive SMR Launcher Apple Silicon")" = arm64

  release:
    if: github.repository == 'Craig-Franklin/Definitive-SMR-Launcher-Apple-Silicon' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-26
    concurrency:
      group: macos-stable-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install arm64 build dependencies
        run: brew install python@3.12 python-tk@3.12
      - name: Prepare exact source release and unique version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SMR_RESERVED_VERSIONS: 0.3.7,0.3.8
        run: /opt/homebrew/bin/python3.12 scripts/release_macos.py prepare
      - name: Install 1Password CLI
        if: steps.release.outputs.release_required == 'true' && steps.release.outputs.published != 'true'
        uses: 1password/install-cli-action@v4
      - name: Build, sign, notarize and package
        if: steps.release.outputs.release_required == 'true' && steps.release.outputs.published != 'true'
        env:
          SMR_TAG: ${{ steps.release.outputs.tag }}
          SMR_VERSION: ${{ steps.release.outputs.version }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SMR_CERT_P12_REF: ${{ vars.SMR_CERT_P12_REF }}
          SMR_CERT_PASSWORD_REF: ${{ vars.SMR_CERT_PASSWORD_REF }}
          SMR_APPLE_TEAM_ID_REF: ${{ vars.SMR_APPLE_TEAM_ID_REF }}
          SMR_NOTARY_KEY_P8_REF: ${{ vars.SMR_NOTARY_KEY_P8_REF }}
          SMR_NOTARY_KEY_ID_REF: ${{ vars.SMR_NOTARY_KEY_ID_REF }}
          SMR_NOTARY_ISSUER_ID_REF: ${{ vars.SMR_NOTARY_ISSUER_ID_REF }}
        run: |
          set -euo pipefail
          if [[ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]]; then
            echo "Required 1Password service account token is not configured" >&2
            exit 1
          fi
          for required in SMR_CERT_P12_REF SMR_CERT_PASSWORD_REF SMR_APPLE_TEAM_ID_REF SMR_NOTARY_KEY_P8_REF SMR_NOTARY_KEY_ID_REF SMR_NOTARY_ISSUER_ID_REF; do
            if [[ "${!required}" != op://* ]]; then
              echo "Required 1Password secret reference is not configured: $required" >&2
              exit 1
            fi
          done
          temporary="$(mktemp -d)"
          keychain="$temporary/release.keychain-db"
          keychain_password="$(uuidgen)"
          cleanup() { security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$temporary"; }
          trap cleanup EXIT
          op read --out-file "$temporary/certificate.p12" "$SMR_CERT_P12_REF"
          op read --out-file "$temporary/notary.p8" "$SMR_NOTARY_KEY_P8_REF"
          SMR_CERT_PASSWORD="$(op read --no-newline "$SMR_CERT_PASSWORD_REF")"
          SMR_APPLE_TEAM_ID="$(op read --no-newline "$SMR_APPLE_TEAM_ID_REF")"
          SMR_NOTARY_KEY_ID="$(op read --no-newline "$SMR_NOTARY_KEY_ID_REF")"
          SMR_NOTARY_ISSUER_ID="$(op read --no-newline "$SMR_NOTARY_ISSUER_ID_REF")"
          unset OP_SERVICE_ACCOUNT_TOKEN
          for required in SMR_CERT_PASSWORD SMR_APPLE_TEAM_ID SMR_NOTARY_KEY_ID SMR_NOTARY_ISSUER_ID; do
            if [[ -z "${!required}" ]]; then
              echo "1Password returned an empty required field: $required" >&2
              exit 1
            fi
            echo "::add-mask::${!required}"
          done
          test -s "$temporary/certificate.p12"
          test -s "$temporary/notary.p8"
          chmod 600 "$temporary/certificate.p12" "$temporary/notary.p8"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$temporary/DeveloperIDG2CA.cer"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $temporary/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$temporary/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$temporary/certificate.p12" -k "$keychain" -P "$SMR_CERT_PASSWORD" -T /usr/bin/codesign
          unset SMR_CERT_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application:/ {print $2; exit}')"
          test -n "$identity"
          export SMR_RELEASE_IDENTITY="$identity"
          export SMR_APPLE_TEAM_ID
          ./scripts/build_macos.sh
          app="dist/Definitive SMR Launcher Apple Silicon.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$SMR_VERSION"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -Fx "TeamIdentifier=$SMR_APPLE_TEAM_ID"
          test "$(lipo -archs "$app/Contents/MacOS/Definitive SMR Launcher Apple Silicon")" = arm64
          /usr/bin/ditto -c -k --norsrc --keepParent "$app" "$temporary/notary.zip"
          xcrun notarytool submit "$temporary/notary.zip" --key "$temporary/notary.p8" --key-id "$SMR_NOTARY_KEY_ID" --issuer "$SMR_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
          asset="Definitive-SMR-Launcher-Apple-Silicon-${SMR_TAG}-arm64.zip"
          /usr/bin/ditto -c -k --norsrc --keepParent "$app" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          dmg="Definitive-SMR-Launcher-Apple-Silicon-${SMR_TAG}-arm64.dmg"
          ./scripts/build_dmg.sh "$app" "$dmg"
          codesign --force --timestamp --sign "$SMR_RELEASE_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$temporary/notary.p8" --key-id "$SMR_NOTARY_KEY_ID" --issuer "$SMR_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - name: Attest exact release archive
        if: steps.release.outputs.release_required == 'true' && steps.release.outputs.published != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            Definitive-SMR-Launcher-Apple-Silicon-*.zip
            Definitive-SMR-Launcher-Apple-Silicon-*.dmg
      - name: Publish personal-fork release
        if: steps.release.outputs.release_required == 'true' && steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SMR_TAG: ${{ steps.release.outputs.tag }}
        run: /opt/homebrew/bin/python3.12 scripts/release_macos.py publish
