[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "definitive-smr-launcher-apple-silicon"
version = "0.3.0"
description = "Apple Silicon preparation and activation services for Sid Meier's Railroads!"
readme = "MACOS_README.md"
requires-python = ">=3.9"
license = {file = "APPLE_SILICON_LICENSE.md"}
authors = [{name = "Craig Franklin"}]
dependencies = []

[project.scripts]
smr-map = "smr_launcher.map_inspect:main"

[project.gui-scripts]
smr-launcher-mac = "smr_launcher.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
force-exclude = true
extend-exclude = ["Definitive-SMR-Launcher", ".handoff", ".local", "private", "local-data"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# dmgbuild injects `defines` when loading its settings file.
"scripts/dmg_settings.py" = ["F821"]
# Preserved research fixture injects its two modules through globals().
"scripts/research/native_window_capture/tests/test_consumer_fake.py" = ["F401", "F821"]

# Preserve existing declarations in source-bound research; do not extend these exceptions.
"scripts/research/batch_smoke.py" = ["F401", "F811"]
"scripts/research/runner_journal.py" = ["F401", "F811"]
"scripts/research/individual_stop_support/wrapper.py" = ["F841"]
"scripts/research/native_window_capture/capture.py" = ["F401"]
"scripts/research/native_window_capture/tests/test_geometry_fake.py" = ["F401"]
"scripts/research/native_window_capture/tests/test_independent_fake.py" = ["F401"]
