<!doctype html>
<html lang="en">

<title>SMR Launcher · rough design review</title>
<style>
*{box-sizing:border-box} :root{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--bg:#eceef0;--panel:#f4f4f5;--paper:#fff;--ink:#202124;--muted:#5f6368;--line:#d4d6da;--accent:#0965c1;--selected:#e6effa;--warn:#805500;--error:#b3261e;--art:#e6e8eb}
body.dark{color-scheme:dark;--bg:#151618;--panel:#292b2e;--paper:#202124;--ink:#f2f3f5;--muted:#b9bdc4;--line:#484b50;--accent:#70b8ff;--selected:#263e59;--warn:#f2c16b;--error:#ffb4ab;--art:#34373c}
body{margin:0;background:var(--bg);color:var(--ink)} button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 11px;min-height:30px}button:hover{background:var(--selected)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:600}body.dark button.primary{color:#102030}button.link{border:0;background:none;color:var(--accent);padding:3px 0;text-align:left}button.active{background:var(--selected);color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 8px}textarea{resize:vertical;min-height:90px;width:100%}h1,h2,h3,p{margin:0}h1{font-size:24px;font-weight:650;line-height:1.25}h2{font-size:20px;line-height:1.3;font-weight:650}h3{font-size:13px;margin-bottom:8px}small,.muted{color:var(--muted)}.review{max-width:1440px;margin:auto;padding:24px 28px 16px}.review p{margin:7px 0 16px;max-width:90ch;color:var(--muted)}.review-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.review-nav .spacer{flex:1}.review-nav label{display:flex;align-items:center;gap:6px}.window{margin:0 28px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:670px;display:flex;flex-direction:column;max-width:1384px}.titlebar{background:var(--panel);border-bottom:1px solid var(--line);height:40px;display:flex;align-items:center;padding:0 16px;gap:8px}.lights{display:flex;gap:7px;margin-right:16px}.lights i{width:11px;height:11px;border:1px solid var(--muted);border-radius:50%;display:block}.titlebar strong{font-size:12px;font-weight:500}.toolbar{height:58px;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}.toolbar strong{font-size:15px;margin-right:auto}.toolbar input{width:215px}.toolbar .nav-menu{display:none;max-width:155px}.body{display:flex;flex:1;min-height:0}.sidebar{width:174px;flex:none;padding:18px 10px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.sidebar button{background:transparent;border:0;text-align:left;padding:7px 10px}.sidebar button.active{background:var(--selected);font-weight:600;color:var(--ink)}.sidebar .bottom{margin-top:auto}.sidebar small{display:block;padding:8px 10px}.map-row:hover:not(.selected),.tile:hover:not(.selected){background:var(--panel)}.list-pane{width:318px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.list-head{padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}.list-head select{width:50%;font-size:12px;padding:5px}.map-list{overflow:auto;flex:1;padding:6px}.map-row{display:flex;width:100%;gap:12px;border:0;border-radius:5px;padding:12px 8px;text-align:left;background:transparent;align-items:center}.map-row.selected{background:var(--selected)}.map-row strong{font-weight:600;display:block;overflow-wrap:anywhere}.map-row small{display:block;margin-top:4px}.thumb{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:3px;background:var(--art);display:grid;place-items:center;font-size:10px;color:var(--muted)}.map-row .thumb{font-size:9px}.row-copy{min-width:0}.detail{flex:1;min-width:0;overflow:auto;padding:24px}.detail-head{display:flex;align-items:flex-start;gap:20px;justify-content:space-between}.detail-head h2{overflow-wrap:anywhere}.detail-head p{margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.art{height:142px;background:var(--art);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;margin:18px 0;text-align:center}.art small{display:block}.warning{color:var(--warn);background:var(--panel);padding:10px 12px;border:1px solid var(--line);margin:16px 0}.error{color:var(--error);border:1px solid var(--error);padding:10px 12px;margin:12px 0}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:22px 0 18px}.tabs button{border:0;background:none;border-radius:0;padding:7px 0;color:var(--muted)}.tabs button.active{border-bottom:2px solid var(--accent);color:var(--ink);font-weight:600}.facts{display:grid;grid-template-columns:128px 1fr;gap:7px 16px;margin:12px 0 18px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.section{padding:18px 0;border-top:1px solid var(--line)}.section p{margin-top:6px;max-width:68ch}.section:first-child{border-top:0}.section details{margin:12px 0}.section summary{cursor:pointer;font-weight:600}.section details p{padding:8px 0 8px 16px}.status{color:var(--muted);font-size:12px;padding:8px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;min-height:35px}.status button{margin-left:auto;min-height:24px;padding:1px 8px;font-size:12px}.annotation{margin:16px 28px 28px;max-width:100ch;color:var(--muted)}.annotation strong{color:var(--ink)}.grid-pane{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.grid-pane .list-head{justify-content:flex-end}.grid-pane .list-head select{width:150px}.map-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));align-content:start;gap:18px;padding:20px}.tile{align-self:start;height:auto;background:none;border:0;text-align:left;padding:6px;min-width:0}.tile .thumb{height:106px;width:100%;margin-bottom:10px}.tile strong{display:block;overflow-wrap:anywhere}.tile small{display:block;margin-top:4px}.tile.selected{background:var(--selected);outline:2px solid var(--accent)}.inspector{width:330px;flex:none;padding:22px;overflow:auto}.inspector .art{height:116px}.inspector .facts{grid-template-columns:80px 1fr}.workflow-grid>.detail{flex:1.2}.workflow-grid>.grid-pane{flex:1}.back{display:none;margin-bottom:16px}.field{display:block;margin:14px 0}.field>span{font-weight:600;display:block;margin-bottom:6px}.field input:not([type=checkbox]),.field select{width:100%}.footer-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:20px;border-top:1px solid var(--line);margin-top:20px}.image-choice{display:flex;gap:14px;align-items:center}.image-choice .thumb{width:88px;height:72px}.context{padding:12px;background:var(--panel);margin:16px 0;font-size:12px}.context details{margin-top:6px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.choices button[aria-pressed=true]{border-color:var(--accent);background:var(--selected)}.empty{margin:auto;padding:40px;max-width:430px;text-align:center}.empty p{margin:10px 0 18px}.empty .actions{justify-content:center}.timeline{list-style:none;margin:0;padding:0}.timeline li{padding:12px 0;border-bottom:1px solid var(--line)}.timeline small{display:block;margin-top:4px}.pref-layout{display:flex;flex:1;min-width:0}.pref-nav{width:185px;flex:none;padding:20px 12px;border-right:1px solid var(--line)}.pref-nav button{display:block;border:0;background:none;width:100%;text-align:left;margin-bottom:5px}.pref-nav button.active{background:var(--selected)}.patterns{max-width:1000px;margin:0 auto;padding:24px 28px}.patterns table{border-collapse:collapse;width:100%;margin-top:16px}.patterns td,.patterns th{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}.patterns th{width:170px}.patterns h2{margin:12px 0}.state-samples{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sample{padding:18px;border:1px solid var(--line);background:var(--paper)}.sample h3{font-size:15px}.sample p{margin:8px 0 14px}.skeleton{height:12px;background:var(--art);margin:10px 0;width:75%}.skeleton.short{width:45%}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(min-width:1450px){.window{margin-left:auto;margin-right:auto}}
@media(max-width:1050px){.sidebar{display:none}.toolbar .nav-menu{display:block}.toolbar strong{display:none}.list-pane{width:300px}.toolbar input{width:180px}.toolbar{gap:8px}.grid-pane{border:0}.inspector{display:none}.body.grid-detail .grid-pane,.body.detail-open .grid-pane{display:none}.body.grid-detail .inspector{display:block;width:100%;max-width:650px;margin:auto}.inspector .back{display:block}}
@media(max-width:950px){.window{height:650px;margin:0 16px}.review{padding:20px 16px 14px}.toolbar{flex-wrap:wrap;height:auto;min-height:58px}.toolbar input{flex:1;min-width:120px}.body:not(.detail-open) .list-pane{width:100%;border:0}.body:not(.detail-open)>.detail{display:none}.body.detail-open .list-pane{display:none}.body.detail-open>.detail{display:block}.detail .back{display:block}.detail{padding:20px}.annotation{margin:16px}.state-samples{grid-template-columns:1fr}.pref-nav{width:155px}}
</style>
<body>
<header class="review">
  <h1>SMR Launcher — rough wireframes</h1>
  <p>Review composition and task flow. Synthetic content; no launcher connection. Craig selected B · artwork grid with inspector. A remains available for comparison.</p>
  <nav class="review-nav" aria-label="Design review screens">
    <button data-screen="a">A · Focused list</button><button data-screen="b">B · Artwork grid</button>
    <button data-screen="edit">Details & images</button><button data-screen="report">Record outcome</button>
    <button data-screen="prefs">Preferences</button><button data-screen="states">States</button><button data-screen="patterns">Pattern sheet</button>
    <span class="spacer"></span><button id="theme">Dark appearance</button>
    <label>State <select id="state"><option value="populated">Populated</option><option value="refreshing">Refreshing</option><option value="error">Refresh error</option><option value="empty">Empty library</option><option value="loading">First load</option><option value="no-results">No results</option></select></label>
  </nav>
</header>
<main id="app"></main>
<p class="annotation" id="annotation"></p>
<script>
// Review-only state. Nothing is written to disk or sent over a network.
const maps=[
 {name:'Cedar Valley',author:'Example author',status:'Known issue · fix not tested',warn:true,kind:'Single player',created:'2009-04-18'},
 {name:'Highland Freight',author:'Author not provided',status:'Not verified',kind:'Single player',created:'Not provided'},
 {name:'Lake District',author:'Example author',status:'Player-confirmed completion',kind:'Single player',created:'2010-06-22'},
 {name:'North Coast',author:'Author not provided',status:'Never opened',kind:'Map type not provided',created:'Not provided'},
 {name:'The Very Long Name of a Fictional Railway Across the Eastern Counties',author:'Example author',status:'History needs inspection',kind:'Single player',created:'Not provided'},
 {name:'Unnamed Map',author:'Author not provided',status:'Not verified · no image',kind:'Map type not provided',created:'Not provided'}
];
const params=new URLSearchParams(location.search);
let screen=params.get('screen')||'b', libraryView=screen==='a'?'a':'b', state=params.get('state')||'populated', selected=0, detailTab='Overview', prefTab='General';
const personalDrafts={},reportDrafts={},paneScroll={}; let reportNote="",reportPhase="Unknown phase",reportIncident="Choose incident · no automatic binding";
let detailOpen=false,gridDetail=false,query='',filter='All maps',sort='Name A–Z',outcome='',draftTitle='',draftNotes='',imageSelected=false,feedback='',reportScenario='',reportGame='',completionReason='',draftKept=false;
const app=document.querySelector('#app');
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(text,action,style='')=>`<button class="${style}" data-action="${action}">${text}</button>`;
const art=(small=false)=>`<div class="${small?'thumb':'art'}" role="img" aria-label="Synthetic image placeholder">${small?'Image':'<div>Map image placeholder<small>Synthetic · no game artwork</small></div>'}</div>`;
const m=()=>maps[selected];
function sidebar(){return `<aside class="sidebar" aria-label="App destinations">${button('Map Library','library','active')}${button('Collection','collection')}${button('Original Game','original')}${button('Activity','activity')}<div class="bottom">${button('Preferences…','prefs')}<small>Steam Mac edition<br>Synthetic preview</small></div></aside>`}
function toolbar(){return `<div class="toolbar"><select class="nav-menu" aria-label="Destination"><option>Map Library</option><option>Collection</option><option>Original Game</option><option>Activity</option></select><strong>Map Library</strong><label class="sr" for="search">Search maps</label><input id="search" placeholder="Search maps" value="${escapeText(query)}" type="search">${button('Import Map…','import')}${button('More…','more')}</div>`}
function filters(){return `<div class="list-head"><select id="filter" aria-label="Filter maps">${['All maps','Known issue','Not verified'].map(v=>`<option${filter===v?' selected':''}>${v}</option>`).join('')}</select><select id="sort" aria-label="Sort maps"><option${sort==='Name A–Z'?' selected':''}>Name A–Z</option><option${sort==='Name Z–A'?' selected':''}>Name Z–A</option></select></div>`}
function results(){let r=maps.map((v,i)=>({...v,i})).filter(v=>v.name.toLowerCase().includes(query.toLowerCase())&&(filter==='All maps'||v.status.includes(filter)));return r.sort((a,b)=>(sort==='Name A–Z'?1:-1)*a.name.localeCompare(b.name))}
function empty(){let title='No maps yet',copy='Import a map archive or browse Collection to begin.',action=button('Import Map…','import','primary')+button('Browse Collection','collection');if(state==='loading'){title='Opening your library';copy='Reading local map information. This is not an empty library.';action='<div class="skeleton"></div><div class="skeleton short"></div>'}if(state==='no-results'||query||filter!=='All maps'){title='No matching maps';copy='Your library is still here. Change the search or filter.';action=button('Clear search & filters','clear','primary')}return `<div class="empty"><h2>${title}</h2><p class="muted">${copy}</p><div class="actions">${action}</div></div>`}
function list(grid=false){if(['empty','loading','no-results'].includes(state)||!results().length)return `<section class="${grid?'grid-pane':'list-pane'}">${filters()}${empty()}</section>`;return `<section class="${grid?'grid-pane':'list-pane'}" aria-label="Maps">${filters()}<div class="${grid?'map-grid':'map-list'}">${results().map(v=>`<button data-map="${v.i}" class="${grid?'tile':'map-row'} ${selected===v.i?'selected':''}" aria-current="${selected===v.i}">${art(true)}<span class="row-copy"><strong>${escapeText(v.name)}</strong><small style="${v.warn?'color:var(--warn)':''}">${v.status}</small></span></button>`).join('')}</div></section>`}
function facts(){return `<dl class="facts"><dt>Author</dt><dd>${m().author}</dd><dt>Map type</dt><dd>${m().kind}</dd><dt>Created</dt><dd>${m().created} · package declaration</dd><dt>Mac testing</dt><dd>Not verified · exact edition/build</dd></dl>`}
function detail(){let body='';if(detailTab==='Overview')body=`${art()}${facts()}<section class="section"><h3>Briefing</h3><p>A fictional railway linking inland towns with the coast. Build a network and complete the scenario goals.</p><div class="actions">${button('Read Aloud','read')}${button('Translate…','translate')}${button('Package Text & Sources','source')}</div></section>`;
 if(detailTab==='Play History')body=`<div class="section"><h3>3 opens · 1 started · 0 completed · 1 crash</h3><p class="muted">Synthetic counts for this edition/build. Opens describe confirmed processes.</p></div><ul class="timeline"><li><strong>Game process exited</strong><small>Automatic observation · outcome unknown</small></li><li><strong>Player confirmed track and trains worked</strong><small>Player confirmation · Coastal scenario · game 1</small></li><li><strong>Crash · phase unknown</strong><small>Retained failure · fix not tested</small></li></ul><div class="actions">${button('Record Outcome…','report')}${button('Record Legacy Mac Test…','legacy')}</div>`;
 if(detailTab==='Issues & Evidence')body=`<section class="section"><h3>Known issue · fix not tested</h3><p>A later successful play does not clear this warning.</p><div class="actions">${button('Record Fix or Test…','fix')}${button('Link Issue…','issue')}</div></section><section class="section"><details><summary>Exact map, edition & build identity</summary><p>Synthetic identities only. Full digests and provenance remain inspectable here. Current action-time validation remains required.</p></details><details><summary>Import checks · static only</summary><p>No synthetic risk flag establishes gameplay compatibility.</p></details><details><summary>Legacy Mac test · separate report</summary><p>Historical reports are retained. They do not create exact scenario/game/save confirmations.</p></details><details><summary>Compatibility options</summary><p>Reviewed recipes and experimental edition controls remain here with their existing safety checks.</p></details></section>`;
 return `<section class="detail" aria-label="Selected map">${button('Back to Library','back','back')}<div class="detail-head"><div><h2>${escapeText(m().name)}</h2><p class="muted">Original edition · local library</p></div>${button('Play','play','primary')}</div>${m().warn?'<div class="warning"><strong>Known issue · fix not tested</strong><br>Previous failure retained. Review Issues & Evidence before playing.</div>':`<p class="muted" style="margin-top:14px">${m().status} · gameplay coverage remains separate</p>`}<div class="actions">${button('Edit Details…','edit')}${button('Record Outcome…','report')}</div><div class="tabs" aria-label="Map detail sections">${['Overview','Play History','Issues & Evidence'].map(v=>`<button data-detail="${v}" class="${detailTab===v?'active':''}">${v}</button>`).join('')}</div>${body}</section>`}
function inspector(){return `<aside class="inspector" aria-label="Selected map inspector">${button('Back to Library','back','back')}<h2>${escapeText(m().name)}</h2>${art()}<p style="color:${m().warn?'var(--warn)':'var(--muted)'}">${m().status}</p>${facts()}<div class="actions">${button('Play','play','primary')}${button('Open Details','open-details')}</div><div class="section"><h3>For this map</h3>${button('Edit Details…','edit','link')}<br>${button('Record Outcome…','report','link')}<p class="muted">Grid stays in place. Inspector follows selection.</p></div></aside>`}
function edit(){return `<section class="detail"><div class="detail-head"><div><h2>Edit details & images</h2><p class="muted">${escapeText(m().name)} · personal presentation</p></div>${button('Back to Map','cancel')}</div><div class="context"><strong>From the package · read-only</strong><p style="margin:7px 0">${m().author} · ${m().kind}</p><details><summary>Review all package facts</summary>${facts()}</details>Personal changes override display only. Original package stays intact.</div><label class="field"><span>Personal display name</span><input id="draft-title" value="${escapeText(draftTitle)}" placeholder="Use package name"></label><label class="field"><span>Personal notes</span><textarea id="draft-notes" placeholder="Add a note for yourself">${escapeText(draftNotes)}</textarea></label><div class="field"><span>Library image</span><div class="image-choice">${art(true)}<div>${button('Choose Local Image…','image')}<p class="muted">${imageSelected?'Synthetic image selected · original unchanged':'Use existing thumbnail, or choose your own image.'}</p>${button('Use Package Image','revert-image','link')}</div></div></div>${feedback?`<div class="${feedback.includes('could not')?'error':'context'}" role="status">${feedback}</div>`:''}<div class="footer-actions">${button('Keep Draft & Close','keep-draft')}${button('Save Details','save-details','primary')}</div></section>`}
function report(){const details=outcome?reportFields():'';return `<section class="detail"><div class="detail-head"><div><h2>Record this session</h2><p class="muted">What did you reach, or what went wrong?</p></div>${button('Later','defer')}</div><div class="context"><strong>${escapeText(m().name)} · original edition</strong><br>Session 11 Oct, 14:20 · process exit observed · outcome unknown<details><summary>Inspect known session context</summary><p>Map/edition/build/attempt prefilled from the session. These synthetic identifiers do not certify gameplay.</p></details></div><div class="choices">${['Played','Problem','Saved','Resumed','Completed'].map(v=>`<button data-outcome="${v}" aria-pressed="${outcome===v}">${v}</button>`).join('')}</div>${!outcome?'<p class="muted">Choose an outcome to see only the required fields. Nothing is inferred from process exit.</p>':''}${details}${feedback?`<div class="context" role="status">${feedback}</div>`:''}<div class="footer-actions">${button('Keep Draft & Close','defer')}<button class="primary" data-action="record" ${outcome?'':'disabled'}>Record Confirmation</button></div></section>`}
function reportFields(){let fields=`<label class="field"><span>Scenario</span><select id="scenario"><option value="">Choose scenario · unknown</option><option ${reportScenario?'selected':''}>Coastal scenario</option></select></label>`;if(outcome!=='Problem')fields+=`<label class="field"><span>Game</span><select id="game"><option value="">Choose game · unknown</option><option ${reportGame==='Continue recorded game 1'?'selected':''}>Continue recorded game 1</option><option ${reportGame==='Start a new game'?'selected':''}>Start a new game</option></select></label>`;
 if(outcome==='Played')fields+='<div class="context">Confirmation: track, stations and trains worked during gameplay. This does not record completion, saving or reopening.</div>';
 if(outcome==='Problem')fields+=`<label class="field"><span>Where did the problem occur?</span><select id="phase">${["Unknown phase","Loading scenario","During gameplay","Saving","Reopening exact save"].map(v=>`<option ${reportPhase===v?"selected":""}>${v}</option>`).join("")}</select></label><label class="field"><span>Failure attribution</span><select id="incident">${["Choose incident · no automatic binding","Retained crash from this session","Record a new player-reported failure"].map(v=>`<option ${reportIncident===v?"selected":""}>${v}</option>`).join("")}</select></label><p class="muted">Unknown attribution stays unknown. No raw diagnostics or paths appear here.</p>`;
 if(['Saved','Resumed'].includes(outcome))fields+=`<label class="field"><span>Exact save identity</span>${button('Choose Exact Save…','save-identity')}<p class="muted">Read only; store the digest, never save bytes or path.</p></label><div class="context">${outcome==='Saved'?'Confirm only that you made this exact save.':'Confirm that you reopened this exact save. Continued play is a separate checkpoint.'}</div>`;
 if(outcome==='Completed')fields+=`<label class="field"><span>Completion reason</span><select id="completion"><option value="">Choose reason</option><option ${completionReason==='Met all scenario goals'?'selected':''}>Met all scenario goals</option><option ${completionReason==='Retired'?'selected':''}>Retired</option></select></label><p class="muted">Count once for this game. Earlier failures remain until an applicable fix test passes.</p>`;
 return fields+`<details class="section"><summary>Optional note</summary><label class="field"><span>Session note</span><textarea id="report-note" placeholder="Personal draft only">${escapeText(reportNote)}</textarea></label></details>`}
function preferences(){const body={General:`<h2>General</h2><label class="field"><span>Interface language</span><select><option>English</option><option>System language</option></select></label><label class="field"><span>Briefing voice</span><select><option>System default</option></select></label><p class="muted">Language and voice use existing immediate-save behavior. Mockup changes no settings.</p><div class="actions">${button('Manage Voices…','read')}${button('Translation Languages…','translate')}</div>`,Updates:`<h2>Updates</h2><label class="field"><input type="checkbox"> Automatically check for launcher updates</label><p class="muted">Illustrative value; preserve current preferences and signed-update checks.</p>${button('Check for Updates','updates')}`,Library:`<h2>Library & Setup</h2><p class="muted">Inspect library location, Steam discovery and existing setup/recovery commands here.</p><div class="actions">${button('Show Library Folder','folder')}${button('Setup & Recovery…','setup')}</div><div class="warning">Profile changes retain their existing game-stopped and preservation checks. No setup action runs in this mockup.</div>`,Privacy:`<h2>Crash Reporting</h2><p class="muted">Illustrative controls. Preserve actual saved values; this preview never arms a collector.</p><label class="field"><input type="checkbox"> Monitor game crashes</label><label class="field"><input type="checkbox"> Stop runaway game memory use</label><label class="field"><input type="checkbox"> Automatically report sanitized crashes to GitHub</label><div class="context">Public reports exclude personal paths, save names, raw logs and attachments. Review status and sanitized content before manual publication.</div>${button('Review Local Reports…','crash')}`}[prefTab];return `<div class="pref-layout"><aside class="pref-nav" aria-label="Preference categories">${['General','Updates','Library','Privacy'].map(v=>`<button data-pref="${v}" class="${v===prefTab?'active':''}">${v==='Privacy'?'Crash Reporting':v}</button>`).join('')}</aside><section class="detail">${button('Back to Library','library','link')}<div style="margin-top:18px">${body}</div>${feedback?`<div class="context" role="status">${feedback}</div>`:''}</section></div>`}
function status(){let text='6 synthetic maps · presentation only';if(state==='refreshing')text='Refreshing local information… · keeping last good content';if(state==='error')text='Could not refresh map information · showing last good content';if(state==='loading')text='First load · reading local information';if(state==='empty')text='No maps imported';if(state==='no-results')text='0 matches · library preserved';if(feedback&&['a','b'].includes(screen))text=feedback;return `<footer class="status" role="status"><span>${text}</span>${state==='error'?button('Retry','retry'):button('Refresh','refresh')}</footer>`}
function boards(){if(screen==='patterns')return `<article class="patterns"><h2>One Mac pattern language</h2><p class="muted">Proposed rules · full reference and feasibility in DESIGN.md. Native control metrics take precedence over these browser approximations.</p><table><tr><th>Hierarchy</th><td>System font · title 20 · section/body 13 · secondary 11–12. Full names wrap. Technical identities use fixed width only inside disclosure.</td></tr><tr><th>Spacing</th><td>4 pt base · 8 between controls · 12 row padding · 16 groups · 24 pane margins. Shared label alignment.</td></tr><tr><th>Navigation</th><td>Sidebar for destinations. Toolbar for library operations. Detail pane for selected map. One contextual primary action.</td></tr><tr><th>Selection & focus</th><td>Blue selection fill; separate visible keyboard ring. Arrow keys select; Return opens details. Play always explicit.</td></tr><tr><th>Input</th><td>Known facts read-only. Personal edits separate. Inline validation retains drafts. File picker uses native dialog at implementation.</td></tr><tr><th>Feedback</th><td>Keep content during refresh. Explain failure and offer Retry. Distinguish empty, loading and no matches. Status always has text.</td></tr><tr><th>Evidence</th><td>Observed process exit, player confirmation, legacy report and unknown remain separate. Serious known issue stays visible.</td></tr><tr><th>Controls</th><td>${button('Primary','demo','primary')} ${button('Secondary','demo')} <button disabled>Unavailable</button> Native SwiftUI controls; no decorative motion.</td></tr><tr><th>Window behavior</th><td>Wide: sidebar/grid/inspector. Narrow: destination menu and grid OR detail, with Back. Preserve scroll, selection and draft.</td></tr></table></article>`;
 return `<article class="patterns"><h2>Representative states</h2><p class="muted">Use the State menu on A/B for full-window examples. Dark appearance applies to every screen.</p><div class="state-samples"><section class="sample"><h3>No maps yet</h3><p>Import an archive or browse Collection.</p>${button('Import Map…','import','primary')}</section><section class="sample"><h3>No matching maps</h3><p>Your library remains intact.</p>${button('Clear search & filters','clear')}</section><section class="sample"><h3>Opening your library</h3><div class="skeleton"></div><div class="skeleton short"></div><p>First load; not an empty result.</p></section><section class="sample"><h3>Refreshing…</h3><p>Keep current maps, selection and scroll visible. A stale row cannot certify current evidence.</p></section><section class="sample"><h3>Could not refresh</h3><p>Showing last good content. Details/Play still require current validation.</p>${button('Retry','retry')}</section><section class="sample"><h3>Image could not be read</h3><p>Keep the existing image and the rest of the draft.</p>${button('Choose Another Image…','image')}</section><section class="sample"><h3>Author not provided</h3><p>Missing package facts stay unknown. Personal notes do not manufacture provenance.</p></section><section class="sample"><h3>The Very Long Name of a Fictional Railway Across the Eastern Counties</h3><p>Wrap full title; allow natural row height. No tooltip-only recovery.</p></section></div></article>`}
function render(){document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'Light appearance':'Dark appearance';document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));document.querySelector('#state').value=state;document.querySelector('#state').disabled=!['a','b'].includes(screen);if(['patterns','states'].includes(screen)){app.innerHTML=boards();document.querySelector('#annotation').textContent='Review artifact only. No native accessibility, performance or game behavior claim.';return}
 const grid=screen==='b'||(libraryView==='b'&&['edit','report','details'].includes(screen));
 const unavailable=['empty','loading','no-results'].includes(state), hidden=!results().some(v=>v.i===selected);
 const selectionMessage='<section class="detail"><h2>Selected map is hidden by the filter</h2><p>Choose a visible map or clear search and filters. Map actions are unavailable.</p></section>';
 const right=unavailable?'<section class="detail"><p class="muted">Select a map when content is available.</p></section>':hidden?selectionMessage:screen==='edit'?edit():screen==='report'?report():screen==='b'?inspector():detail();
 let content=screen==='prefs'?preferences():sidebar()+list(grid)+right;
 app.innerHTML=`<div class="window"><div class="titlebar"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><strong>Definitive SMR Launcher · rough macOS composition</strong></div>${toolbar()}<div class="body ${detailOpen||['edit','report'].includes(screen)?'detail-open':''} ${gridDetail?'grid-detail':''} ${grid&&screen!=='b'?'workflow-grid':''}">${content}</div>${status()}</div>`;
 document.querySelector('#annotation').innerHTML={a:'<strong>A · Initial recommendation.</strong> Scan names and issues in a stable list. Read, edit and report in the same detail pane. Small images retain recognition. More rows fit than the grid.',b:'<strong>B · Selected by Craig.</strong> Larger artwork helps visual recognition. The inspector follows selection; fewer maps fit. At narrow widths, open details with Back to the preserved grid.',edit:'<strong>Details & images.</strong> Review package facts, add personal information, choose an image, save once. Keep Draft and Cancel protection are explicit. Image choice simulates a recoverable failure; it never opens a file.',report:'<strong>Contextual reporting.</strong> Session prefilled, outcome first. Exact-save and failure fields appear only when needed. Common known-session path targets three decisions; unknown bindings add required choices.',prefs:'<strong>Preferences.</strong> Group existing settings. Keep system menu entry and immediate-save semantics where already supported. Values here are illustrative, never read from the real launcher.'}[screen]||'';
}
let listScroll=0;function remember(){const l=document.querySelector('.map-list,.map-grid');if(l)listScroll=l.scrollTop;const t=document.querySelector('#draft-title'),n=document.querySelector('#draft-notes');if(t)draftTitle=t.value;if(n)draftNotes=n.value;const note=document.querySelector('#report-note');if(note)reportNote=note.value;
 personalDrafts[selected]={draftTitle,draftNotes,draftKept};reportDrafts[selected]={outcome,reportScenario,reportGame,completionReason,reportNote,reportPhase,reportIncident};const pane=document.querySelector('.detail');if(pane)paneScroll[screen]=pane.scrollTop}
function update(){render();const l=document.querySelector('.map-list,.map-grid');if(l)l.scrollTop=listScroll;const pane=document.querySelector('.detail');if(pane)pane.scrollTop=paneScroll[screen]||0}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;remember();if(b.dataset.screen){screen=b.dataset.screen;if(['a','b'].includes(screen))libraryView=screen;state='populated';feedback='';detailOpen=['edit','report'].includes(screen);update();return}if(b.dataset.map!==undefined){selected=Number(b.dataset.map);({draftTitle,draftNotes,draftKept}=personalDrafts[selected]||{draftTitle:'',draftNotes:'',draftKept:false});({outcome,reportScenario,reportGame,completionReason,reportNote,reportPhase,reportIncident}=reportDrafts[selected]||{outcome:'',reportScenario:'',reportGame:'',completionReason:'',reportNote:'',reportPhase:'Unknown phase',reportIncident:'Choose incident · no automatic binding'});detailOpen=true;gridDetail=true;feedback='';update();return}if(b.dataset.detail){detailTab=b.dataset.detail;update();return}if(b.dataset.pref){prefTab=b.dataset.pref;feedback='';update();return}if(b.dataset.outcome){outcome=b.dataset.outcome;feedback='';update();return}const action=b.dataset.action;if(!action)return;
 if(['edit','report','prefs'].includes(action)){screen=action;detailOpen=true;feedback=draftKept&&action==='edit'?'Recovered personal draft.':''}
 else if(action==='library'||action==='back'){screen=libraryView;detailOpen=false;gridDetail=false;feedback=''}
 else if(action==='open-details'){screen=libraryView==='b'?'details':'a';detailOpen=true;gridDetail=true}
 else if(action==='clear'){query='';filter='All maps';state='populated';screen=libraryView}
 else if(action==='refresh'){state='refreshing'}else if(action==='retry'){state='populated';feedback='Synthetic refresh complete · selection retained'}
 else if(action==='image'){imageSelected=false;feedback='Image could not be read. Choose another image; existing image and draft are retained.'}
 else if(action==='revert-image'){imageSelected=false;feedback='Package image selected for presentation.'}
 else if(action==='keep-draft'){draftKept=true;screen=libraryView;feedback='Personal draft kept in this preview. Reopen Edit Details to recover it.'}
 else if(action==='save-details'){screen=libraryView;feedback='Synthetic details saved in memory · package unchanged';draftKept=false}
 else if(action==='cancel'){if(draftTitle||draftNotes){feedback='Unsaved changes. Choose Keep Draft & Close, or Discard Draft below.';update();document.querySelector('.footer-actions').insertAdjacentHTML('afterbegin',button('Discard Draft','discard'));return}screen=libraryView}
 else if(action==='discard'){draftTitle='';draftNotes='';draftKept=false;screen=libraryView;feedback='Synthetic personal draft discarded'}
 else if(action==='defer'){screen=libraryView;feedback='Outcome draft deferred · no confirmation recorded'}
 else if(action==='record'){feedback=(!reportScenario&&outcome!=='Problem')?'Choose the scenario. Your draft is retained.':(!reportGame&&outcome!=='Problem')?'Choose the game. Your draft is retained.':outcome==='Completed'&&!completionReason?'Choose the completion reason. Your draft is retained.':['Saved','Resumed'].includes(outcome)?'Exact-save identity required. This review does not read saves.':outcome==='Problem'?'Choose a failure attribution or explicitly retain unknown. This review records no event.':'Synthetic confirmation preview · no history event written. Existing failures remain.'}
 else feedback={play:'Play preview only. Existing current validation and known-issue confirmation would run before any real launch.',import:'Import preview only. Implementation uses native file selection and existing guarded import.','save-identity':'Read-only exact-save picker belongs here. No file is read in this review.',collection:'Collection remains a separate searchable source table with download/import progress. No network action.',original:'Original Game remains a separate destination. Existing guarded activation remains required.',legacy:'Legacy Mac Test remains a separate labeled report; it does not create exact scenario events.',fix:'Fix test flow requires scenario, implemented fix, attributed failure/checkpoint and a new confirmed test open. No auto-pass.',more:'Secondary menu: Refresh Library; Show Library Folder; existing guarded removal in map details.',source:'Package Text & Sources disclosure: original text and declared source links; personal edits stay separate.',issue:'Link only the authorized personal-repository issue, with exact or related applicability.',crash:'Local report review and current privacy controls remain separate. No collector or publication runs.'}[action]||'Navigation concept only. No app or system action runs.';
 update();
});
document.addEventListener('change',e=>{remember();if(e.target.id==='state'){state=e.target.value;screen=['a','b'].includes(screen)?screen:'a';detailOpen=false;feedback='';update()}if(e.target.id==='filter'){filter=e.target.value;update()}if(e.target.id==='sort'){sort=e.target.value;update()}if(e.target.id==='scenario')reportScenario=e.target.value;if(e.target.id==='game')reportGame=e.target.value;if(e.target.id==='completion')completionReason=e.target.value;if(e.target.id==='phase')reportPhase=e.target.value;if(e.target.id==='incident')reportIncident=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='search'){remember();query=e.target.value;screen=['a','b'].includes(screen)?screen:libraryView;state='populated';detailOpen=false;const pos=e.target.selectionStart;update();const input=document.querySelector('#search');input.focus();if(input.type!=='search')input.setSelectionRange(pos,pos)}});
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'Light appearance':'Dark appearance'};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='f'){e.preventDefault();document.querySelector('#search')?.focus()}if(e.key==='Escape'&&['edit','report'].includes(screen)){document.querySelector('[data-action="cancel"],[data-action="defer"]')?.click()}});
if(params.get('theme')==='dark'){document.body.classList.add('dark');document.querySelector('#theme').textContent='Light appearance'}render();
</script>
</body>
